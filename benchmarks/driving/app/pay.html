<!doctype html>
<html><head><meta charset="utf-8"><title>Payment widget</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#fff;color:#111}</style>
</head><body>
  <p>Invoice INV-2041</p>
  <p>Total due: <strong id="total">128.50</strong> USD</p>
  <button id="pay">Pay now</button>
  <script>
    document.getElementById('pay').addEventListener('click', () => {
      document.getElementById('pay').textContent = 'Paid';
      window.parent.postMessage('paid', '*');
    });
  </script>
</body></html>
