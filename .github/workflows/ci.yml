name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflows call this, so nothing red ever ships

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Sync
        run: uv sync
      - name: Install browsers
        run: uv run playwright install --with-deps chromium chromium-headless-shell firefox webkit
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  replay:
    # The action as users get it, run against the committed example traces:
    # once resolving decisions, once re-running a whole recorded agent run, and
    # once the pytest plugin's trace (which fills a password from the env).
    runs-on: ubuntu-latest
    env:
      DEMO_PASSWORD: hunter2
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          trace: examples/local-demo/demo.trace.jsonl
          report: replay-report.md
          version: local
      - uses: ./
        with:
          trace: examples/go-demo/demo.trace.jsonl
          execute: "true"
          report: replay-go-report.md
          version: local
      - uses: ./
        with:
          trace: examples/pytest-interop/test_sign_in.trace.jsonl
          execute: "true"
          report: replay-pytest-report.md
          version: local
      - name: Report
        run: cat replay-report.md replay-go-report.md replay-pytest-report.md
