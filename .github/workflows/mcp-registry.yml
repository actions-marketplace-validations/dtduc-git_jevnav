name: MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: the registry trusts the workflow's identity
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Publish server.json
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc || ./mcp-publisher login github
          # the registry verifies package ownership against PyPI, and this job
          # starts at the same moment as the PyPI publish: give it time to land
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed (PyPI may not have the version yet); retrying in 20s"
            sleep 20
          done
          echo "registry publish failed after 6 attempts" >&2
          exit 1
