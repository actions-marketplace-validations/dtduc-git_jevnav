name: jevnav replay
description: >-
  Replay a recorded jevnav trace in CI: fail when a site change breaks a
  recorded decision. Offline — no model call, no API key.
branding:
  icon: navigation
  color: purple

inputs:
  trace:
    description: Path to the trace JSONL to replay
    required: true
  report:
    description: Where to write the markdown replay report (empty = skip)
    required: false
    default: ""
  version:
    description: jevnav version, or "local" to run the checkout (for this repo's own CI)
    required: false
    default: latest
  execute:
    description: Also re-run the recorded actions (needs any ${ENV} values set)
    required: false
    default: "false"
  json:
    description: Print the machine-readable result as well
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Replay the trace
      shell: bash
      env:
        TRACE: ${{ inputs.trace }}
        REPORT: ${{ inputs.report }}
        VERSION: ${{ inputs.version }}
        EXECUTE: ${{ inputs.execute }}
        JSON: ${{ inputs.json }}
      run: |
        set -euo pipefail
        if [ "$VERSION" = "local" ]; then
          uv sync
          run_jevnav() { uv run --no-sync jevnav "$@"; }
          run_python() { uv run --no-sync python "$@"; }
        elif [ "$VERSION" = "latest" ]; then
          run_jevnav() { uvx jevnav "$@"; }
          run_python() { uvx --from jevnav python "$@"; }
        else
          run_jevnav() { uvx "jevnav@$VERSION" "$@"; }
          run_python() { uvx --from "jevnav==$VERSION" python "$@"; }
        fi
        run_python -m playwright install --with-deps chromium
        args=(replay "$TRACE")
        if [ -n "$REPORT" ]; then args+=(--report "$REPORT"); fi
        if [ "$EXECUTE" = "true" ]; then args+=(--execute); fi
        if [ "$JSON" = "true" ]; then args+=(--json); fi
        run_jevnav "${args[@]}"
